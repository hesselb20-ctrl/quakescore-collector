<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="800" height="464" role="img" aria-label="Data flow: in the browser, devicemotion readings (acceleration with gravity, about 60 a second) are timed for 10 seconds to fix the rate, next to a typed building name, floor and charging box. On the phone, they are resampled to a 100 or 200 Hz grid and FIR-decimated into three bands at 50, 12.5 and 3.125 Hz; a 120-second warm-up checks the phone is flat and levels it, seconds with movement are set aside, and 2048-point windows are averaged into spectra per band. For the user, the page builds one upload schema v1 JSON file of about 200 kB with no location, saves it by download or share sheet, sends nothing itself, and keeps a snapshot in local storage every 60 seconds.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#111111}.mute{fill:#5F5F5F}.acc{fill:#000000}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="464" rx="3" fill="#F5F5F5"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E8E8E8" stroke-width="1"/></pattern></defs>
<rect width="800" height="464" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M776 14H786V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M24 450H14V440" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M776 450H786V440" fill="none" stroke="#5F5F5F" stroke-width="1"/>
<text x="36" y="54" class="m" font-size="10.5"><tspan class="acc">A</tspan><tspan class="mute" dx="10">In the browser</tspan></text><line x1="180.79999999999998" y1="50" x2="764" y2="50" stroke="#E8E8E8"/><rect x="36" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.00s" cx="52" cy="93" r="3" fill="#000000"/>
<text x="64" y="97" class="m ink" font-size="11" font-weight="600">Motion sensor</text>
<text x="52" y="119" class="s mute" font-size="12">devicemotion, with gravity</text>
<text x="52" y="135" class="s mute" font-size="12">about 60 readings a second</text><path class="flow" d="M252 111H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 107l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.45s" cx="308" cy="93" r="3" fill="#000000"/>
<text x="320" y="97" class="m ink" font-size="11" font-weight="600">Setup</text>
<text x="308" y="119" class="s mute" font-size="12">building name, floor</text>
<text x="308" y="135" class="s mute" font-size="12">charging box, iOS permission</text><path class="flow" d="M508 111H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 107l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.90s" cx="564" cy="93" r="3" fill="#000000"/>
<text x="576" y="97" class="m ink" font-size="11" font-weight="600">Rate probe</text>
<text x="564" y="119" class="s mute" font-size="12">first 10 s set the rate</text>
<text x="564" y="135" class="s mute" font-size="12">grid of 100 or 200 Hz</text><path class="flow" d="M656 150V172H226V207" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M222 206l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="36" y="194" class="m" font-size="10.5"><tspan class="acc">B</tspan><tspan class="mute" dx="10">On the phone</tspan></text><line x1="164.39999999999998" y1="190" x2="764" y2="190" stroke="#E8E8E8"/><rect x="36" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.35s" cx="52" cy="233" r="3" fill="#000000"/>
<text x="64" y="237" class="m ink" font-size="11" font-weight="600">Resample + FIR</text>
<text x="52" y="259" class="s mute" font-size="12">three bands: 50, 12.5,</text>
<text x="52" y="275" class="s mute" font-size="12">3.125 Hz, linear phase</text><path class="flow" d="M252 251H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 247l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.80s" cx="308" cy="233" r="3" fill="#000000"/>
<text x="320" y="237" class="m ink" font-size="11" font-weight="600">Gate + level</text>
<text x="308" y="259" class="s mute" font-size="12">120 s warm-up, flat check</text>
<text x="308" y="275" class="s mute" font-size="12">moving seconds set aside</text><path class="flow" d="M508 251H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 247l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.25s" cx="564" cy="233" r="3" fill="#000000"/>
<text x="576" y="237" class="m ink" font-size="11" font-weight="600">Spectra</text>
<text x="564" y="259" class="s mute" font-size="12">2048-point Hann windows</text>
<text x="564" y="275" class="s mute" font-size="12">averaged per band</text><path class="flow" d="M656 290V312H226V347" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M222 346l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="36" y="334" class="m" font-size="10.5"><tspan class="acc">C</tspan><tspan class="mute" dx="10">For the user</tspan></text><line x1="164.39999999999998" y1="330" x2="764" y2="330" stroke="#E8E8E8"/><rect x="36" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.70s" cx="52" cy="373" r="3" fill="#000000"/>
<text x="64" y="377" class="m ink" font-size="11" font-weight="600">Session file</text>
<text x="52" y="399" class="s mute" font-size="12">upload schema v1 JSON</text>
<text x="52" y="415" class="s mute" font-size="12">about 200 kB, no location</text><path class="flow" d="M252 391H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 387l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.15s" cx="308" cy="373" r="3" fill="#000000"/>
<text x="320" y="377" class="m ink" font-size="11" font-weight="600">Save or share</text>
<text x="308" y="399" class="s mute" font-size="12">download or share sheet</text>
<text x="308" y="415" class="s mute" font-size="12">the page sends nothing</text><path class="flow" d="M508 391H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 387l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.60s" cx="564" cy="373" r="3" fill="#000000"/>
<text x="576" y="377" class="m ink" font-size="11" font-weight="600">Snapshot</text>
<text x="564" y="399" class="s mute" font-size="12">every 60 s in localStorage</text>
<text x="564" y="415" class="s mute" font-size="12">save the last session again</text>
</svg>